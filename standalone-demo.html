<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro Animation — Standalone Demo (Vanilla HTML/JS)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        :root {
            --color-green: #29725f;
            --color-lightblue: #82a0ff;
            --color-darkblue: #4b69f0;
            --color-lightgreen: #e6fab9;
            --color-orange: #f5693c;
            --color-maroon: #a0325a;
            --color-pink: #f0befa;
            --bg-color: #f7f5f2;
            --color-dark: #1e1e24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--color-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        /* ─── Scribble SVG Overlay ─── */
        .transition-scribble {
            position: fixed;
            top: -50vh;
            left: -50vw;
            width: 200vw;
            height: 200vh;
            z-index: 9999;
            pointer-events: none;
            color: var(--color-darkblue);
        }

        /* ─── Center Logo Overlay ─── */
        .transition-logo-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10000;
            pointer-events: none;
            opacity: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .intro-center-logo {
            font-size: clamp(2.5rem, 7vw, 4.5rem);
            font-weight: 900;
            letter-spacing: -0.03em;
        }

        body.is-transitioning {
            pointer-events: none !important;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 2.5rem;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        p {
            color: #666;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        button {
            background: #000000;
            color: #ffffff;
            border: none;
            padding: 0.9rem 1.8rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- SVG Scribble Mask -->

            stroke-linecap="round"

        />
    </svg>

    <!-- Center Logo / Wiggle Container -->
    <div id="logoContainer" class="transition-logo-container">
        <div id="logoInner">
            <svg class="logo-svg" width="160" height="45" viewBox="0 0 150 35" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 180px; height: auto;">

                    fill="currentColor"/>
            </svg>
        </div>
    </div>

    <!-- Page Content Revealed After Intro -->
    <div class="card">
        <h1>مرحباً بك في صفحة المعاينة</h1>
        <p>هذا الملف يعمل مباشرة في أي متصفح بدون تثبيت أي حزم Node.js أو Next.js! يعتمد على مكتبة GSAP عبر CDN.</p>
        <button onclick="runIntro()">إعادة تشغيل الانترو ↺</button>
    </div>

    <script>
        const colors = [
            { value: '#29725f', isLight: false },
            { value: '#82a0ff', isLight: true },
            { value: '#4b69f0', isLight: false },
            { value: '#e6fab9', isLight: true },
            { value: '#f5693c', isLight: false },
            { value: '#a0325a', isLight: false },
            { value: '#f0befa', isLight: true }
        ];

        let isRunning = false;

        function runIntro() {
            if (isRunning) return;
            isRunning = true;

            const svg = document.getElementById('scribbleSvg');
            const path = document.getElementById('scribblePath');
            const logoContainer = document.getElementById('logoContainer');
            const logoInner = document.getElementById('logoInner');

            // Pick random color
            const color = colors[Math.floor(Math.random() * colors.length)];
            svg.style.color = color.value;

            const logoSvg = logoInner.querySelector('.logo-svg');
            logoSvg.style.color = color.isLight ? '#000000' : '#ffffff';

            const l = path.getTotalLength() + 10;
            const durIn = 2.0;
            const durOut = 2.4;

            gsap.set(svg, { scale: 0.7, opacity: 1 });
            gsap.set(path, { strokeDasharray: l, strokeDashoffset: l, strokeWidth: '8%', opacity: 1 });
            gsap.set(logoContainer, { opacity: 0 });

            document.body.classList.add('is-transitioning');

            const tl = gsap.timeline({
                onComplete: () => {
                    isRunning = false;
                    document.body.classList.remove('is-transitioning');
                    gsap.set(path, { strokeWidth: '0%' });
                    gsap.set(logoContainer, { opacity: 0 });
                    gsap.killTweensOf(logoInner);
                }
            });

            // 1. Draw scribble in
            tl.to(path, { strokeDashoffset: 0, duration: durIn, ease: 'power1.inOut' }, 0);
            tl.to(path, { strokeWidth: '32%', duration: durIn, ease: 'power2.inOut' }, 0);

            // 2. Fade in logo & start wiggle
            tl.to(logoContainer, {
                opacity: 1,
                duration: durIn * 0.45,
                ease: 'power2.out',
                onStart: () => {
                    gsap.to(logoInner, {
                        rotation: 6,
                        duration: 0.14,
                        repeat: -1,
                        yoyo: true,
                        ease: 'steps(1)'
                    });
                }
            }, durIn * 0.48);

            // 3. Fade out logo
            tl.to(logoContainer, {
                opacity: 0,
                duration: 0.25,
                ease: 'power2.in',
                onComplete: () => {
                    gsap.killTweensOf(logoInner);
                    gsap.set(logoInner, { rotation: 0 });
                }
            }, durIn + (durOut * 0.4));

            // 4. Undraw scribble away
            tl.to(path, { strokeDashoffset: -l, duration: durOut, ease: 'power2.inOut' }, durIn);
            tl.to(path, { strokeWidth: '8%', duration: durOut, ease: 'power2.inOut' }, durIn);
        }

        // Run automatically when page loads
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(runIntro, 150);
        });
    </script>
</body>
</html>
